name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read
  packages: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/dockules:latest
